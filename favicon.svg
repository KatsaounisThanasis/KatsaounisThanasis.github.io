<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- TK, drawn as geometry so it needs no font, plus the ember block that
       stands in for a terminal cursor. void #050505, ink #FAFAFA, ember #FF3333. -->
  <rect width="64" height="64" rx="8" fill="#050505"/>
  <g fill="#FAFAFA">
    <rect x="3" y="12" width="22" height="8"/>
    <rect x="10" y="12" width="8" height="40"/>
    <rect x="30" y="12" width="8" height="40"/>
    <polygon points="28,32 38,32 51,12 41,12"/>
    <polygon points="28,32 38,32 51,52 41,52"/>
  </g>
  <rect x="54" y="46" width="6" height="6" fill="#FF3333"/>
</svg>
