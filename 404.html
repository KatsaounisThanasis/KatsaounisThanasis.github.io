<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 // Thanos Katsaounis</title>
    <link rel="icon" href="/favicon.svg" />
    <meta name="theme-color" content="#050505" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #050505;
        color: #FAFAFA;
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        -webkit-font-smoothing: antialiased;
      }
      .container {
        max-width: 540px;
        width: 100%;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background-color: #0D0D0D;
        padding: 48px 36px;
        position: relative;
      }
      .code {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.25em;
        color: #FF3333;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 32px;
        font-weight: 900;
        letter-spacing: -0.03em;
        margin-bottom: 16px;
        line-height: 1.15;
      }
      p {
        font-size: 14px;
        line-height: 1.6;
        color: #888888;
        margin-bottom: 32px;
      }
      a {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #FAFAFA;
        color: #050505;
        text-decoration: none;
        padding: 12px 24px;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        transition: background 0.2s ease, transform 0.2s ease;
      }
      a:hover {
        background: #FFFFFF;
        transform: translateY(-1px);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="code">404 // Out of Bounds</div>
      <h1>NOT FOUND<span style="color: #FF3333">.</span></h1>
      <p>The coordinate you navigated to does not exist, or the infrastructure has moved.</p>
      <a href="/">← Return to Base</a>
    </div>
  </body>
</html>
